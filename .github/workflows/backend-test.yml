name: Backend Test CI/CD

on:
  push:
    branches:
      - test

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release


  build-and-push-image:
    runs-on: ubuntu-latest

    needs:
      - build-and-test

    environment: test

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name "${{ vars.ACR_NAME }}"

      - name: Generate image tag
        id: image-tag
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE_TAG="${TIMESTAMP}-${SHORT_SHA}"

          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Docker image tag: ${IMAGE_TAG}"

      - name: Build Docker image
        run: |
          docker build \
            -f ./src/OmniDesk.Api/Dockerfile \
            -t "${{ vars.ACR_LOGIN_SERVER }}/omnidesk-api:${{ steps.image-tag.outputs.tag }}" \
            .

      - name: Push Docker image
        run: |
          docker push \
            "${{ vars.ACR_LOGIN_SERVER }}/omnidesk-api:${{ steps.image-tag.outputs.tag }}"

  build-migration-bundle:
    runs-on: ubuntu-latest

    needs:
      - build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build EF Core migration bundle
        run: |
          mkdir -p ./artifacts

          dotnet ef migrations bundle \
            --project ./src/OmniDesk.Infrastructure \
            --startup-project ./src/OmniDesk.Api \
            --context IdentityDbContext \
            --configuration Release \
            --self-contained \
            --target-runtime linux-x64 \
            --output ./artifacts/efbundle

      - name: Upload migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: ef-migration-bundle
          path: ./artifacts/efbundle

  migrate-database:
    runs-on: ubuntu-latest

    needs:
      - build-migration-bundle
      - build-and-push-image

    environment: test

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download migration bundle
        uses: actions/download-artifact@v4
        with:
          name: ef-migration-bundle
          path: ./artifacts

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apply database migrations
        shell: bash
        run: |
          chmod +x ./artifacts/efbundle

          CONNECTION_STRING="Server=tcp:${{ vars.SQL_SERVER_FQDN }},1433;Initial Catalog=${{ vars.SQL_DATABASE }};Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"

          ./artifacts/efbundle \
            --connection "$CONNECTION_STRING"
